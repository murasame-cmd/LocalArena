name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Run JVM logic simulation
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalArena-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.1.0-build-${{ github.run_number }}
          APK_NAME: LocalArena-v0.1.0-build-${{ github.run_number }}.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          gh release create "$TAG_NAME" "$APK_NAME"             --target "$GITHUB_SHA"             --title "LocalArena 0.1.0 — Build ${{ github.run_number }}"             --notes "Автоматическая тестовая сборка LocalArena.

- Chess
- Sea Battle
- Durak
- Локальная игра по одной Wi-Fi сети
- Бесплатная версия без рекламы и игровых ограничений
- Платежи и Premium-контент пока не подключены

APK прикреплён непосредственно к GitHub Release."             --latest
