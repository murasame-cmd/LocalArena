name: Android APK

concurrency:
  group: localarena-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Run JVM logic simulation
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run emulator smoke tests
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-boot-anim -noaudio
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LocalArena.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalArena-debug
          path: app/build/outputs/apk/debug/LocalArena.apk

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LocalArena — Latest
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/LocalArena.apk

      - name: Publish build-tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: LocalArena v0.1.0-build-${{ github.run_number }}
          prerelease: false
          make_latest: false
          generate_release_notes: true
          files: app/build/outputs/apk/debug/LocalArena.apk
