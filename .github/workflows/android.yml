name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Run JVM logic simulation
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalArena-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle)"
          TAG="v${VERSION_NAME}"
          APK="LocalArena-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK}"

          gh release create "${TAG}" "${APK}"             --title "LocalArena ${TAG}"             --notes "## LocalArena ${TAG}

          Android debug APK for the current MVP build.

          - Chess
          - Sea Battle
          - Durak
          - Local multiplayer over the same network
          - Free base edition
          - No ads
          - No artificial limits
          - Support/Premium payments are not connected yet

          The APK is provided for testing and is not a Play Store release."             --latest
