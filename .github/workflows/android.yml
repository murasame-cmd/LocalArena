name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Run JVM logic simulation
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalArena-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*["']\([^"']*\)["'].*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName"
            exit 1
          fi

          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 ||             gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk               --title "LocalArena $TAG"               --notes "LocalArena base edition — Android APK.

- Chess
- Sea Battle
- Durak
- Local multiplayer over the same Wi-Fi
- Free edition without ads or gameplay limits

This is a debug/MVP build for testing."               --latest
