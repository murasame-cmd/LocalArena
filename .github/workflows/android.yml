name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Run JVM logic simulation
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LocalArena.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalArena-debug
          path: app/build/outputs/apk/debug/LocalArena.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LocalArena — Latest
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/LocalArena.apk
