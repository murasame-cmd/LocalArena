name: Android Release

on:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: LocalArena-debug
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          APK="./artifact/app-debug.apk"
          TAG="v0.1.0-build-${RUN_NUMBER}"
          ASSET="LocalArena-${TAG}.apk"
          cp "${APK}" "${ASSET}"

          gh release create "${TAG}" "${ASSET}" \
            --target "${TARGET_SHA}" \
            --title "LocalArena ${TAG}" \
            --generate-notes \
            --latest
